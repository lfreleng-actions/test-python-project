name: 'Sandbox legacy'

on:
  workflow_dispatch:

permissions: {}

jobs:
  legacy:
    name: 'Legacy'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - name: 'First checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Second checkout'
        uses: actions/checkout@v4
